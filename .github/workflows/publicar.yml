# Compila el motor de rutas (WebAssembly), construye el mapa de carreteras de
# España y lo publica todo, gratis, en Cloudflare Pages.
#
# - Se ejecuta a mano (Actions → "Publicar motor y mapa" → Run workflow),
#   cada mes (para tener el mapa al día) y cuando cambia el código.
# - Necesita dos secretos del repositorio (ver README):
#   CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
#   Sin ellos, todo se construye igual pero no se publica.
name: Publicar motor y mapa

on:
  workflow_dispatch:
  schedule:
    # Día 3 de cada mes, 04:17 UTC.
    - cron: '17 4 3 * *'
  push:
    branches: [main]
    paths:
      - 'prueba/**'
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/publicar.yml'

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  motor:
    name: Motor de rutas (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reutilizar el motor si no ha cambiado
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            engine/dist
            engine/lib
          key: motor-${{ hashFiles('engine/**') }}

      - name: Compilar Valhalla a WebAssembly (unos 40 minutos)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: engine
        run: sh scripts/build.sh

      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - name: Compilar la API del motor
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          npm install --no-save --no-package-lock typescript@5.9
          npx tsc -p tsconfig.json
          cp js/default-config.json lib/

      - uses: actions/upload-artifact@v4
        with:
          name: motor
          path: |
            engine/dist
            engine/lib
            engine/VALHALLA_VERSION
          retention-days: 30

  publicar:
    name: Mapa de España y publicación
    needs: motor
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: motor
          path: motor-build

      - name: Mes actual
        id: mes
        run: echo "mes=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Reutilizar el mapa de este mes
        id: cache
        uses: actions/cache@v4
        with:
          path: work/tiles
          key: teselas-espana-${{ steps.mes.outputs.mes }}-${{ hashFiles('scripts/construir-teselas.sh', 'engine/VALHALLA_VERSION') }}

      - name: Liberar espacio en disco
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Construir el mapa de carreteras de España (1-2 horas)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh scripts/construir-teselas.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar la web (comprimir teselas y comprobar límites)
        run: node scripts/preparar-sitio.mjs work/tiles motor-build

      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos de Cloudflare: no se publica. Ver README, paso 3."
            exit 0
          fi
          npx --yes wrangler@4 pages project create rutaflow-motor --production-branch=main || true
          npx --yes wrangler@4 pages deploy site --project-name=rutaflow-motor --branch=main --commit-dirty=true
